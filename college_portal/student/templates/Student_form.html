<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #102A56, #2563A6, #E4F1FF);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: #FFFFFF;
            padding: 35px;
            border-radius: 18px;
            border: 1px solid #B8D7F5;
            box-shadow: 0 15px 45px rgba(16,42,86,0.2);
        }

        h1 {
            text-align: center;
            color: #102A56;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #718096;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #102A56;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #B8D7F5;
            border-radius: 8px;
            background: #F8FBFF;
            outline: none;
            font-size: 15px;
            transition: 0.3s;
        }

        input:focus {
            border-color: #2563C7;
            box-shadow: 0 0 8px rgba(37,99,199,0.25);
        }

        button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #4A90E2, #2563C7);
            color: #FFFFFF;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: linear-gradient(135deg, #2563C7, #102A56);
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(37,99,199,0.3);
        }

        .result {
            margin-top: 25px;
            padding: 18px;
            background: #F8FBFF;
            border: 1px solid #B8D7F5;
            border-left: 5px solid #2563C7;
            border-radius: 8px;
        }

        .result h3 {
            color: #2563C7;
            margin-bottom: 12px;
        }

        .result p {
            margin: 8px 0;
            color: #53657D;
        }

        .result strong {
            color: #102A56;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Student Registration</h1>
    <p class="subtitle">Enter your details below</p>

    <form action="/add/" method="POST">
        {% csrf_token %}

        <div class="form-group">
            <label>Registration Number</label>
            <input type="text" name="reg_no"
                   placeholder="Enter registration number" required>
        </div>

        <div class="form-group">
            <label>Student Name</label>
            <input type="text" name="name"
                   placeholder="Enter your name" required>
        </div>

        <div class="form-group">
            <label>Email Address</label>
            <input type="email" name="email"
                   placeholder="Enter your email" required>
        </div>

        <div class="form-group">
            <label>Marks</label>
            <input type="number" name="marks"
                   placeholder="Enter your marks"
                   min="0" max="100" required>
        </div>

        <div class="form-group">
            <label>Date of Birth</label>
            <input type="date" name="dob" required>
        </div>

        <button type="submit">Submit Details</button>
    </form>

    {% if student %}
    <div class="result">
        <h3>Registration Successful!</h3>

        <p><strong>Registration No:</strong> {{ student.reg_no }}</p>
        <p><strong>Name:</strong> {{ student.name }}</p>
        <p><strong>Email:</strong> {{ student.email }}</p>
        <p><strong>Marks:</strong> {{ student.marks }}</p>
        <p><strong>Date of Birth:</strong> {{ student.dob }}</p>
    </div>
    {% endif %}

</div>

</body>
</html>
